<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script type="module" src="./src/js/app.js" defer></script>
    <title>Carrossel</title>
</head>

<body>
    <header></header>
    <main>
        <section class="container">
            <article id="btnEsquerda">
                <button type="button">
                    <img src="./images/chevron-left.svg alt="Anterior">
                </button>
            </article>

            <article id="carrossel">
                <!-- A primeira div com a classe 'ativa' -->
                <div class="imagemCar1 ativa">
                    <img src="./images/imgCarrossel1.jpg" alt="Imagem 1">
                </div>
                <div class="imagemCar2">
                    <img src="./images/imgCarrossel2.jpg" alt="Imagem 2">
                </div>
                <div class="imagemCar3">
                    <img src="./images/imgCarrossel3.jpg" alt="Imagem 3">
                </div>
            </article>

            <article id="btnDireita">
                <button type="button">
                    <img src="./images/chevron-right.svg" alt="Próximo">
                </button>
            </article>
        </section>
    </main>
    <footer></footer>
</body>

</html>
